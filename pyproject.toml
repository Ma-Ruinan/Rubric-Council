[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-rubric-generator"
version = "1.0.0"
description = "Generate and audit task-specific AI Agent benchmark rubrics with OpenCode agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Rubric Generator Contributors"}]
dependencies = [
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
]

[project.scripts]
rubric-generator = "rubric_generator.cli:main"

[tool.setuptools.packages.find]
include = ["rubric_generator*"]
